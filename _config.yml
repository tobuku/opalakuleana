# ==========================================
# ŌPALA KULEANA - JEKYLL CONFIGURATION
# ==========================================

# Site settings
title: ʻŌpala Kuleana
tagline: "Your ʻŌpala is Our Kuleana"
description: Professional junk removal service in Oahu, Hawaii. We remove furniture, appliances, construction debris, and more. Free estimates. Serving Ewa Beach, Honolulu, Kapolei, and all of Oahu.
author: ʻŌpala Kuleana
email:
url: "https://opalakuleana.com"
baseurl: ""
repository: tobuku/opalakuleana

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Exclude from processing
exclude:
  - .gitignore
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/ok-logo-flat.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "ʻŌpala Kuleana"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# SEO
logo: /assets/images/ok-logo-flat.png
social:
  name: ʻŌpala Kuleana
  links:
    - https://opalakuleana.com
    - https://www.yelp.com/biz/opala-kuleana-urban-honolulu-2
    - https://www.google.com/maps/place/Opala+Kuleana/
    - https://www.facebook.com/opalakuleana
    - https://x.com/opalakuleana
